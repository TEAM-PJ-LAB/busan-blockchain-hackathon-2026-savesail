name: devnet-p1
# PRD 2.1 P1 on devnet: the P1 LiteSVM tests on the Token ACL and gate binaries dumped from devnet, then a
# deployment and the P1 run (Token-2022 tranche mints, Token ACL MintConfig, ABL allow list, hook transfers).
on:
  workflow_dispatch:
  push:
    branches: [devnet-p1-trigger]
permissions:
  contents: write
concurrency: devnet
jobs:
  p1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ROLE_SEED: ${{ secrets.ROLE_SEED }}
      RPC_URL: https://api.devnet.solana.com
      TACL: TACLkU6CiCdkQN2MjoyDkVg2yAH9zkxiHDsiztQ52TP
      GATE: GATEzzqxhJnsWF6vHRsgtixxSB8PaQdcqGEVTEHWiULz
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cache/solana
            target
          key: ${{ runner.os }}-sbf-4.6.0-${{ hashFiles('Cargo.lock') }}
      - run: command -v cargo-build-sbf || cargo install cargo-build-sbf --version 4.6.0 --locked
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
        working-directory: scripts
      - name: Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Keys (never printed) and program id
        working-directory: scripts
        run: |
          test -n "$ROLE_SEED" || { echo "::error::set the ROLE_SEED repository secret (PRD §3)"; exit 1; }
          umask 077
          ADMIN=$(npx tsx run/admin_key.ts "$RUNNER_TEMP/admin.json")
          PROGRAM_ID=$(npx tsx run/program_key.ts "$RUNNER_TEMP/program.json")
          echo "ADMIN=$ADMIN" >> "$GITHUB_ENV"
          echo "PROGRAM_ID=$PROGRAM_ID" >> "$GITHUB_ENV"
          echo "admin (deployer) $ADMIN, program $PROGRAM_ID"
      - name: Build program with the devnet id
        run: |
          OLD=$(python3 -c "import json;print(json.load(open('idl/savesail.json'))['address'])")
          sed -i "s/$OLD/$PROGRAM_ID/g" programs/savesail/src/lib.rs Anchor.toml idl/savesail.json
          cargo build-sbf && sha256sum target/deploy/savesail.so
      - name: Dump Token ACL and the ABL gate from devnet
        run: |
          solana config set --url "$RPC_URL" --keypair "$RUNNER_TEMP/admin.json"
          mkdir -p "$RUNNER_TEMP/devnet-programs" p1-record
          solana program show "$TACL" | tee p1-record/token_acl_show.txt
          solana program show "$GATE" | tee p1-record/gate_show.txt
          solana program dump "$TACL" "$RUNNER_TEMP/devnet-programs/token_acl.so"
          solana program dump "$GATE" "$RUNNER_TEMP/devnet-programs/token_acl_gate.so"
          (cd "$RUNNER_TEMP/devnet-programs" && sha256sum *.so) | tee p1-record/devnet_dump_sha256.txt
      - name: P1 tests on the built fixtures and on the devnet binaries
        run: |
          rm -f target/tmp/k2_hits.txt
          cargo test --test p1 2>&1 | tee p1-record/p1_tests_fixtures.txt
          P1_FIXTURES="$RUNNER_TEMP/devnet-programs" cargo test --test p1 -- --nocapture 2>&1 | tee p1-record/p1_tests_devnet_binaries.txt
          grep -q "test result: ok. 13 passed" p1-record/p1_tests_fixtures.txt
          grep -q "test result: ok. 13 passed" p1-record/p1_tests_devnet_binaries.txt
      - name: Fund check
        run: |
          for i in 1 2 3; do
            bal=$(solana balance --lamports | cut -d' ' -f1)
            [ "$bal" -ge 6000000000 ] && break
            solana airdrop 2 || sleep 20
          done
          solana balance
          bal=$(solana balance --lamports | cut -d' ' -f1)
          if [ "$bal" -lt 5000000000 ]; then
            echo "::error::deployer $ADMIN has $bal lamports; the upgrade buffer needs about 4.4 SOL. Fund it with devnet SOL (https://faucet.solana.com) and re-run (PRD Q8)"
            exit 1
          fi
      - name: Deploy (extend the program account first if the binary grew)
        run: |
          SIZE=$(stat -c %s target/deploy/savesail.so)
          if solana program show "$PROGRAM_ID" --output json > show.json 2>/dev/null; then
            LEN=$(python3 -c "import json;print(json.load(open('show.json'))['dataLen'])")
            if [ "$LEN" -lt "$SIZE" ]; then solana program extend "$PROGRAM_ID" $((SIZE - LEN)); fi
          fi
          solana program deploy target/deploy/savesail.so --program-id "$RUNNER_TEMP/program.json" --max-len "$SIZE" | tee p1-record/deploy.txt
          echo "| $(date -u +%FT%TZ) | ${GITHUB_SHA::7} | $(solana slot) | $(sha256sum target/deploy/savesail.so | cut -c1-16) | P1 |" >> docs/deployments.md
      - name: P1 run
        working-directory: scripts
        run: |
          DEAL_ID=$(( 900000 + ${{ github.run_number }} )) npx tsx run/p1.ts devnet
          npx tsx run/check_p1_chain.ts ../app/public/p1-run.json | tee ../p1-record/web_chain_check.txt
      - name: Commit the record
        if: always()
        run: |
          git config user.name "Bugeon Park"
          git config user.email "bugeon.pk@gmail.com"
          ls p1-record > /dev/null 2>&1 || { echo "no record"; exit 0; }
          git checkout --orphan records-only
          git rm -rqf --cached .
          git add -f p1-record docs/deployments.md
          [ -f app/public/p1-run.json ] && git add -f app/public/p1-run.json
          git commit -m "devnet P1 (${{ github.run_id }})"
          git push origin HEAD:refs/heads/devnet-p1-${{ github.run_id }}
